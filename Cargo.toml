[workspace]
resolver = "2"
members = ["crates/*"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.statusline]
opt-level = "z"

[workspace.lints.rust]
# sl-macos opts in with a crate-level `#![expect]`; `forbid` here would block that.
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }   # `make lint` runs with -D warnings
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
cast_precision_loss = "allow"   # f64 drawing maths
similar_names = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
string_slice = "warn"
unreachable = "warn"
exit = "warn"
mem_forget = "deny"
let_underscore_must_use = "warn"
let_underscore_future = "deny"
rc_mutex = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "warn"
try_err = "warn"
map_err_ignore = "warn"
lossy_float_literal = "warn"
