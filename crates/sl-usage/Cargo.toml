[package]
name = "sl-usage"
version = "0.1.0"
edition.workspace = true

[dependencies]
chrono = "0.4"
dirs = "6.0.0"
memchr = "2.8"
# File-system events (FSEvents on macOS), so a quiet refresh need not stat the
# whole tree: see `watch`.
notify = "8"
rustc-hash = "2.1"
# The usage store. `bundled` compiles SQLite in, so there is no system library
# version to depend on.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sl-core = { path = "../sl-core" }
ruzstd = "0.9.1"

# `examples/measure_refresh.rs` reads the process's disk counters.
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
sl-macos = { path = "../sl-macos" }

[lints]
workspace = true
